name: Deploy to Production VPS (CD)

on:
  push:
    branches:
      - main
      - feature/new-frontend-structure

jobs:
  deploy:
    name: Continuous Deployment to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Iniciando despliegue en el VPS..."
            cd ~/AcademiaNeiva
            
            # Sincronizar cambios de la rama activa
            TARGET_BRANCH="${{ github.ref_name }}"
            echo "🌿 Rama: $TARGET_BRANCH"
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"
            
            # Habilitar BuildKit para construcción rápida con caché
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Construir imágenes en paralelo aprovechando caché
            echo "🔨 Construyendo imágenes en paralelo..."
            docker compose build --parallel
            
            # Levantar contenedores actualizados
            echo "🚀 Levantando contenedores..."
            docker compose up -d --remove-orphans
            
            # Limpiar imágenes intermedias huérfanas
            docker image prune -f
            
            echo "✅ ¡Despliegue completado exitosamente!"
